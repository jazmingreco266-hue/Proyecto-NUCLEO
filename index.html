  <body>
    <!--
      GitHub Pages no sabe de rutas de React Router: si alguien entra directo
      a /Proyecto-NUCLEO/privacidad (o Google lo intenta), el servidor no
      encuentra ese archivo y muestra un 404. El 404.html de public/
      redirige acá codificando la ruta real; este script la decodifica y
      la reescribe en la barra de direcciones antes de que arranque React
      Router, para que la app cargue la página correcta.
      (técnica: https://github.com/rafgraph/spa-github-pages)
    -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
